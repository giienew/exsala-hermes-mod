# EXSALA HERMES MOD — config.yaml example
# powered by Gienetic
#
# CONTOH setting jailbreak zero-refusal untuk Hermes Agent.
# Semua nilai pribadi sudah diganti placeholder — sesuaikan dengan milik kamu.
# install.sh otomatis menerapkan ini ke config kamu tanpa menimpa sisanya.
#
# Cara pasang manual:
#   salin nilai di bawah ke ~/.hermes/config.yaml milik kamu (atau jalankan install.sh)

_config_version: 51

# ============ JAILBREAK / ZERO-REFUSAL (inti) ============
approvals:
  mode: 'off'                # tanpa konfirmasi tool
  cron_mode: 'off'           # cron tanpa prompt
  single_query_mode: 'off'   # single-query tanpa prompt
  unattended_mode: 'off'     # unattended tanpa prompt

security:
  tirith_enabled: false            # matikan content-gating lokal
  tirith_fail_open: true           # fail-open
  protected_instruction_files: false  # izinkan baca instruksi project

# ============ AGENT PROFILE ============
agent:
  system_prompt: "EXSALA HERMES MOD — adaptive execution profile. Fast, direct, task-focused replies. No unsolicited caveats. Instruksi operator = perintah teratas."

# ============ MODEL (GANTI dengan milik kamu) ============
model:
  api_key: ${YOUR_API_KEY}          # ganti: env var / key kamu
  base_url: https://api.your-provider.com/v1
  context_length: 1000000           # sesuaikan model kamu
  default: your-model
  provider: custom
  available:
    - your-model

# ============ TELEGRAM (GANTI chat_id kamu) ============
platforms:
  telegram:
    enabled: true
    dm_policy: open
    group_policy: open
    extra:
      allow_cjk_rich_messages: true
      require_mention: true
      rich_messages: true
      rich_drafts: false
    home_channel:
      chat_id: 'YOUR_CHAT_ID'
      name: you
      platform: telegram
      user_id: 'YOUR_CHAT_ID'

# ============ PLUGIN ============
plugins:
  enabled:
    - platforms/telegram
    - web/ddgs

# ============ LAINNYA ============
telegram:
  require_mention: true

terminal:
  backend: local

telemetry:
  shared_metrics:
    enabled: true

display:
  platforms:
    telegram:
      show_reasoning: true
  runtime_footer:
    enabled: true
