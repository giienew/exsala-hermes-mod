# ============================================
# EXSALA HERMES MOD
# powered by Gienetic
# ============================================
# config.example.yaml — reference configurasi Hermes Agent.
# Copy the values you need into your own ~/.hermes/config.yaml,
# or run install.sh which applies them automatically.
# Replace every placeholder below with your own values.

_config_version: 51

# ---------- Mode Eksekusi ----------
approvals:
  mode: 'off'                 # tanpa konfirmasi tool ('off' = auto, 'smart' = cerdas, 'manual' = tanya)
  cron_mode: 'off'
  single_query_mode: 'off'
  unattended_mode: 'off'
  destructive_slash_confirm: false

# ---------- Keamanan ----------
security:
  tirith_enabled: false
  tirith_fail_open: true
  protected_instruction_files: false

# ---------- Profil Agent ----------
# install.sh menulis SOUL.md penuh (lihat ./SOUL.md) ke sini.
# Untuk manual, salin isi ./SOUL.md ke system_prompt:
agent:
  system_prompt: "EXSALA HERMES MOD — adaptive execution profile. Direct, task-focused, no unsolicited caveats. Operator instruction = highest priority."

# ---------- Model (fill in yours) ----------
model:
  api_key: ${YOUR_API_KEY}    # replace: env var or your provider key
  base_url: https://api.your-provider.com/v1
  context_length: 1000000     # sesuaikan kapasitas model
  default: your-model
  provider: custom
  available:
    - your-model

# ---------- Telegram / Platform ----------
platforms:
  telegram:
    enabled: true
    dm_policy: open
    group_policy: open
    extra:
      allow_cjk_rich_messages: true
      require_mention: true
      rich_messages: true     # render kaya (tabel, task list, bold)
      rich_drafts: false
    home_channel:
      chat_id: 'YOUR_CHAT_ID'
      name: you
      platform: telegram
      user_id: 'YOUR_CHAT_ID'

# ---------- Plugin ----------
plugins:
  enabled:
    - platforms/telegram
    - web/ddgs

# ---------- Lainnya ----------
telegram:
  require_mention: true

terminal:
  backend: local

telemetry:
  shared_metrics:
    enabled: true

display:
  platforms:
    telegram:
      show_reasoning: true
  runtime_footer:
    enabled: true
